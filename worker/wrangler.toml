name = "storage-cloudflare-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_BUCKET = "music-player-storage"
B2_REGION = "us-east-005"
CORS_ORIGINS = "https://ayushghbk-afk.github.io,https://localhost,capacitor://localhost"
MAX_UPLOAD_BYTES = "104857600"
ACCESS_TOKEN_SECONDS = "900"
REFRESH_TOKEN_SECONDS = "2592000"
STREAM_TICKET_SECONDS = "43200"

# Required Cloudflare secrets (set with wrangler secret put, never in this file):
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, B2_KEY_ID, B2_APPLICATION_KEY, AUTH_SECRET
