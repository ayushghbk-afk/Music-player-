plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace = "com.aether.audio.player"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.aether.audio.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.0.0-native"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            if (System.getenv('AETHER_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AETHER_KEYSTORE_PATH'))
                storePassword System.getenv('AETHER_STORE_PASSWORD')
                keyAlias System.getenv('AETHER_KEY_ALIAS')
                keyPassword System.getenv('AETHER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBomVersion}")

    implementation "androidx.core:core-ktx:${rootProject.ext.androidxCoreVersion}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.androidxActivityVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.androidxLifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.androidxLifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.androidxLifecycleVersion}"

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    implementation "androidx.media3:media3-exoplayer:${rootProject.ext.media3Version}"
    implementation "androidx.media3:media3-session:${rootProject.ext.media3Version}"
    implementation "androidx.media3:media3-ui:${rootProject.ext.media3Version}"
    implementation "androidx.media3:media3-common:${rootProject.ext.media3Version}"

    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2'

    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// A release must never silently produce an unsigned distributable.
tasks.matching { it.name == 'validateSigningRelease' }.configureEach { task ->
    task.doFirst {
        ['AETHER_KEYSTORE_PATH', 'AETHER_STORE_PASSWORD', 'AETHER_KEY_ALIAS', 'AETHER_KEY_PASSWORD'].each { name ->
            if (!System.getenv(name)) throw new GradleException("Missing release signing environment: " + name)
        }
    }
}
