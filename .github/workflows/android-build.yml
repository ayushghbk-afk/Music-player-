name: Android builds
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release using repository secrets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    # Avoid ubuntu-latest image migrations changing the Android toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Use the runner's supported Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
          # Feed enough answers without a yes|sdkmanager SIGPIPE under pipefail.
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-licenses.txt"
          "$SDKMANAGER" --licenses < "$RUNNER_TEMP/android-licenses.txt"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:android
      - run: chmod +x android/gradlew
      - name: Build and lint debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        working-directory: android
      - name: Annotate native build failures
        if: failure()
        shell: python
        run: |
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gradle.log'
          if path.exists():
              lines = path.read_text().splitlines()
              selected = []
              for index, line in enumerate(lines):
                  if 'error:' in line or ' Error:' in line or 'What went wrong' in line or 'Execution failed' in line:
                      selected.extend(lines[max(0,index-1):index+7])
              text = '\n'.join(selected or lines[-50:])[:12000]
              text = text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Native build diagnostics::' + text)
      - name: Verify debug APK signature
        run: apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.jks"
          chmod 600 "$RUNNER_TEMP/aether-release.jks"
      - name: Signed release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: android
        env:
          AETHER_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.jks
          AETHER_STORE_PASSWORD: ${{ secrets.AETHER_STORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: aether-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-release.jks"
