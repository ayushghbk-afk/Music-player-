name: Android builds
on:
  push:
    branches: [main, arena/7c9ae165-music-player]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release using repository secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.jks"
          chmod 600 "$RUNNER_TEMP/aether-release.jks"
      - name: Signed release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: android
        env:
          AETHER_KEYSTORE_PATH: ${{ runner.temp }}/aether-release.jks
          AETHER_STORE_PASSWORD: ${{ secrets.AETHER_STORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: aether-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aether-release.jks"
